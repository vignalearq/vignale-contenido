<body>

<title>Vignale Arquitectura</title>
<meta name="theme-color" content="#363932">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Archivo:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Una sola pantalla de celular, centrada en escritorio. Paleta única de marca (verde #363932 + crudo). */
:root{--ground:#1F211C;--brand:#363932;--paper:#F2F1EC;color-scheme:dark}
html,body{height:100%;background:var(--ground);overscroll-behavior:none}
body{margin:0}
#app{height:100%}
button:focus-visible,a:focus-visible{outline:2px solid #F2F1EC;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;scroll-behavior:auto!important}}

body{margin:0}
a{color:#363932}a:hover{color:#1f211c}
.va-bg{background-image:url(img/logo-va.png);background-size:225px 184px;background-repeat:no-repeat}
.wm-bg{background-image:url(img/logo-wordmark.png);background-size:320px 45px;background-repeat:no-repeat}
@keyframes vaIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes haze{0%{filter:blur(0)}30%{filter:blur(1.2px)}100%{filter:blur(4px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes smokeRise{0%{transform:translateY(0) scale(1,1);opacity:1}25%{opacity:.95}60%{opacity:.55}100%{transform:translateY(-120px) scale(1.12,1.45);opacity:0}}
@keyframes pageIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes fabIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes inkIn{0%{opacity:0;color:#F2F1EC;filter:blur(6px)}40%{opacity:1;color:#C9C7BE;filter:blur(2px)}100%{opacity:1;color:#363932;filter:blur(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(242,241,236,.45)}100%{box-shadow:0 0 0 16px rgba(242,241,236,0)}}
.va-in{animation:vaIn 1.2s ease-out both}
.ltr{animation:draw .26s cubic-bezier(.3,0,.6,1) both}
.scr{animation:draw 2s cubic-bezier(.35,.05,.5,1) both}
.fade{animation:fadeIn 2s ease-out .2s both}
@keyframes smokeSoft{0%{filter:blur(0);transform:none;opacity:1}30%{filter:blur(2px);transform:translateY(-16px) scale(1.02,1.1) skewX(3deg);opacity:.85}60%{filter:blur(6px);transform:translateY(-58px) scale(1.06,1.3) skewX(-4deg);opacity:.45}100%{filter:blur(14px);transform:translateY(-130px) scale(1.12,1.6) skewX(5deg);opacity:0}}
@keyframes ghostA{0%{filter:blur(3px);transform:none;opacity:0}25%{opacity:.4}55%{filter:blur(9px);transform:translate(-8px,-70px) scale(1.1,1.5) skewX(-9deg);opacity:.28}100%{filter:blur(18px);transform:translate(6px,-170px) scale(1.2,2.1) skewX(8deg);opacity:0}}
@keyframes ghostB{0%{filter:blur(4px);transform:none;opacity:0}30%{opacity:.35}60%{filter:blur(11px);transform:translate(10px,-85px) scale(1.12,1.6) skewX(10deg);opacity:.22}100%{filter:blur(20px);transform:translate(-8px,-190px) scale(1.25,2.3) skewX(-7deg);opacity:0}}
.smoking-css{animation:smokeSoft 3s cubic-bezier(.45,.05,.7,1) both;transform-origin:50% 100%;will-change:transform,filter,opacity}
.ghostA{animation:ghostA 3s ease-out .15s both;transform-origin:50% 100%;will-change:transform,filter,opacity}
.ghostB{animation:ghostB 3.1s ease-out .4s both;transform-origin:50% 100%;will-change:transform,filter,opacity}
@keyframes vfade{0%,78%{opacity:1}100%{opacity:0}}
.vfade{animation:vfade 1.7s linear both}
@keyframes bgIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.bgIn{animation:bgIn 1.6s ease-out both}
@keyframes pillIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pill{animation:pillIn .6s ease-out .9s both}
.smoking{filter:url(#va-smoke);animation:smokeRise 3.2s cubic-bezier(.45,.05,.75,1) both;transform-origin:50% 100%}
.page{animation:pageIn .15s cubic-bezier(.2,.7,.2,1) both}
.fab{animation:fabIn .5s ease-out .3s both}
.hint-show{animation:pulse 2.2s ease-in-out 5.4s infinite both}
.hint-hide{opacity:0}
.pre{opacity:0}
.rise1{animation:rise .35s ease-out 0s both}
.rise2{animation:rise .35s ease-out .08s both}
.rise3{animation:rise .35s ease-out .16s both}
.slide{animation:slideIn .25s cubic-bezier(.2,.7,.2,1) both}
.ink1{animation:inkIn .28s ease-out 0s both}
.ink2{animation:inkIn .28s ease-out .05s both}
.ink3{animation:inkIn .28s ease-out .1s both}
.btnIn{animation:rise .25s ease-out .12s both}
.row{animation:slideIn .2s cubic-bezier(.2,.7,.2,1) both}
.bob{animation:bob 1.8s ease-in-out infinite}
.ring{animation:ring 1.8s ease-out infinite}
.rise4{animation:rise .35s ease-out .24s both}
.rise5{animation:rise .35s ease-out .32s both}
.tt{margin:0;font-family:'Archivo',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:-.015em;line-height:1.08;font-size:34px}
.tt .th,.th{font-family:'Italiana',serif;font-weight:400;letter-spacing:.01em;font-size:1.06em}
.tl{display:block}
.tl2{display:block;padding-left:.7em}
.tl3{display:block;padding-left:1.4em}
@keyframes lineIn{from{opacity:0;transform:translateX(-28px);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
.rv .l{display:block;overflow:hidden;padding:.08em 0 .14em;margin:-.08em 0 -.14em;white-space:nowrap}
.rv .l.r{text-align:right}.rv .l.c{text-align:center}
.rv .l>span{display:inline-block;transform:translateY(120%)}
@keyframes lineUp{from{transform:translateY(120%)}to{transform:none}}
.rv.on .l>span,.rv.auto .l>span{animation:lineUp .32s cubic-bezier(.08,.82,.54,.99) both}
.rv .l:nth-child(1)>span{animation-delay:0s}.rv .l:nth-child(2)>span{animation-delay:.05s}.rv .l:nth-child(3)>span{animation-delay:.1s}.rv .l:nth-child(4)>span{animation-delay:.15s}
.rv.wrap .l{white-space:normal}.rv.wrap .l>span{display:block}
.estT{transform-origin:0 0}
.estT.shrink{transition:transform .3s cubic-bezier(.65,.05,.36,1)}
.bands.dim{opacity:.45}
.bands{transition:opacity .25s ease;position:absolute;top:0;left:0;right:0;height:100%;pointer-events:none;overflow:hidden}
.bands .media{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.34;max-width:none}
.bands video.media{opacity:.5}
.cov{position:absolute;height:34%;width:160%;will-change:transform}
.cL{left:0;background:linear-gradient(90deg,rgba(242,241,236,0) 0,#F2F1EC 25%);animation:covL .32s cubic-bezier(.65,.05,.36,1) both}
.cR{right:0;background:linear-gradient(270deg,rgba(242,241,236,0) 0,#F2F1EC 25%);animation:covR .32s cubic-bezier(.65,.05,.36,1) both}
@keyframes covL{from{transform:translateX(-25%)}to{transform:translateX(62.5%)}}
@keyframes covR{from{transform:translateX(25%)}to{transform:translateX(-62.5%)}}
.b0{top:0;height:100%;animation-delay:0s;animation-duration:.38s!important}.b1{top:0;animation-delay:0s}.b2{top:33.33%;animation-delay:.04s}.b3{top:66.66%;animation-delay:.08s}
@media (prefers-reduced-motion: reduce){.cov{display:none}}
.rv.late .l>span{animation-delay:.18s!important}
.projT{transition:transform .28s cubic-bezier(.65,.05,.36,1)}
.ln1{animation:lineIn .9s cubic-bezier(.2,.7,.2,1) .1s both}
.ln2{animation:lineIn .9s cubic-bezier(.2,.7,.2,1) .28s both}
.ln3{animation:lineIn .9s cubic-bezier(.2,.7,.2,1) .46s both}

/* ===== Computadora (>= 1000px): misma web, otra distribución ===== */
.dnav{display:none}
.hov{display:none}
.desk.root{max-width:none!important}
.desk .dnav{display:flex;gap:34px;align-items:center;margin-left:auto;margin-right:20px}
.desk .dnav button{font:inherit;background:none;border:none;color:#F2F1EC;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:8px 0;font-family:'Archivo',sans-serif;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;transition:opacity .2s}
.desk .dnav button:hover{opacity:1}
.desk .dnav button .n{font-family:'Italiana',serif;font-weight:400;font-size:15px;letter-spacing:0}
.desk .hamb{display:none!important}
.desk header{height:84px!important;padding:0 4vw!important}
.desk .hero{padding:0 8vw 40px!important}
.desk .heroIn{max-width:1180px}
.desk .heroIn img{width:220px!important}
.desk .estudio{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:7vw;row-gap:28px;padding:150px 8vw 110px!important;align-content:center}
.desk .estudio .est-t{grid-column:1;grid-row:1 / span 3;align-self:center}
.desk .estudio .est-t h2{font-size:64px!important}
.desk .estudio .est-p{grid-column:2;grid-row:1;text-align:left!important;font-size:17px!important;max-width:520px;align-self:end}
.desk .estudio .est-n{grid-column:2;grid-row:2;justify-content:flex-start!important;max-width:520px}
.desk .estudio .est-b{grid-column:2;grid-row:3;margin-top:0!important;max-width:520px;align-self:start}
.desk .page.lst{padding:130px 8vw 90px!important;gap:30px!important}
.desk .page.lst .head{max-width:760px}
.desk .page.lst .tt{font-size:58px}
.desk .page.lst .grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:1px!important}
.desk .page.lst .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.desk .page.lst .grid>button{position:relative;overflow:hidden;flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start;min-height:250px;padding:28px 28px 30px!important;gap:22px!important;transition:background-color .3s}
.desk .page.lst .grid>button>*{position:relative}
.desk .page.lst .grid>button>svg{position:absolute!important;right:24px;bottom:26px;transition:transform .3s}
.desk .page.lst .grid>button:hover>svg{transform:translateX(6px)}
.desk .page.lst .grid>button:hover{background:#ECEAE3!important}
.desk .page.lst .grid>button .hov{display:block;position:absolute!important;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .45s ease,transform .8s ease;pointer-events:none}
.desk .page.lst .grid>button:hover .hov{opacity:.32;transform:none}
.desk .page.detail{padding:130px 7vw 80px calc(50% + 5vw)!important;gap:24px!important}
.desk .page.detail>*{max-width:600px}
.desk .page.detail .tt{font-size:52px}
.desk .page.detail .bands{width:50%!important;max-width:none}
.desk .page.detail .bands .media{opacity:.9}
.desk .page.detail .bands video.media{opacity:.9}
.desk .page.detail .bands.dim{opacity:1}
.desk .page.detail .txt{text-align:left!important;font-size:17px!important}
.desk .page.narrow{padding:130px calc(50% - 340px) 90px!important}
.desk .page.narrow .tt{font-size:52px}
.desk .fabw{left:auto!important;right:36px;bottom:32px!important;width:60px!important;height:60px!important}

/* Compu: todo más grande y con menos aire */
.desk .dnav{gap:40px}
.desk .dnav button{font-size:15px}
.desk .dnav button .n{font-size:18px}
.desk .heroIn{max-width:1500px}
.desk .heroIn img{width:280px!important}
.desk p[style*="letter-spacing: 0.24em"]{font-size:15px!important}
.desk .estudio{padding:120px max(6vw, calc((100% - 1500px) / 2)) 80px!important;column-gap:6vw;row-gap:34px;grid-template-rows:auto auto auto;align-content:center}
.desk .estudio .est-t h2{font-size:clamp(54px,4.9vw,92px)!important}
.desk .estudio .est-p{font-size:21px!important;max-width:620px;gap:18px!important}
.desk .estudio .est-n{max-width:620px;gap:72px!important;padding:18px 0!important}
.desk .estudio .est-n .th{font-size:76px!important}
.desk .estudio .est-n span:not(.th){font-size:17px!important}
.desk .estudio .est-b{max-width:620px}
.desk .estudio .est-b button,.desk .page button[style*="padding: 15px 8px"]{font-size:18px!important;padding:20px 8px!important}
.desk .page.lst{padding:120px 6vw 80px!important;gap:36px!important}
.desk .page.lst .head{max-width:1000px}
.desk .page.lst .tt{font-size:clamp(52px,5.2vw,84px)}
.desk .page.lst .head p:last-child{font-size:20px!important;max-width:760px}
.desk .page.lst .grid>button{min-height:300px;padding:34px 34px 36px!important}
.desk .page.lst .grid>button>span:nth-of-type(1){font-size:44px!important}
.desk .page.lst .grid>button>span:nth-of-type(2)>span:first-child{font-size:25px!important}
.desk .page.lst .grid>button>span:nth-of-type(2)>span:last-child{font-size:18px!important;line-height:1.55!important}
.desk .page.detail{padding:120px 6vw 70px calc(50% + 4vw)!important;gap:28px!important}
.desk .page.detail>*{max-width:680px}
.desk .page.detail .tt{font-size:clamp(46px,4.4vw,74px)}
.desk .page.detail .txt{font-size:21px!important;gap:18px!important}
.desk .page.detail ul li{font-size:19px!important;padding:16px 2px!important}
.desk .page.detail ul li span:first-child{font-size:24px!important}
.desk .page.detail .prices span{font-size:19px!important}
.desk .page.detail .prices span+span{font-size:16px!important}
.desk .page.detail .prices .val{font-size:30px!important}
.desk .page.detail .prices p{font-size:15px!important}
.desk .page.detail a[aria-label^="WhatsApp"]{font-size:20px!important;min-height:68px!important}
.desk .page.narrow{padding:120px calc(50% - 400px) 80px!important;gap:24px!important}
.desk .page.narrow .tt{font-size:clamp(48px,4.6vw,70px)}
.desk .page.narrow p,.desk .page.narrow a{font-size:19px!important}
.desk .page.narrow label{font-size:16px!important}
.desk .page.narrow input,.desk .page.narrow select,.desk .page.narrow textarea{font-size:18px!important}
.desk .page>button:first-child,.desk .page>button[style*="align-self: flex-start"]{font-size:16px!important}

</style>
<div id="app"></div>
<script type="text/x-template" id="tpl"><div class="root" :class="deskCls" style="position: relative; width: 100%; max-width: 480px; height: 100%; margin: 0 auto; overflow: hidden; background: #F2F1EC; font-family: 'Nunito Sans', system-ui, sans-serif; color: #363932">

<template v-if="isHome">
<div id="va-scroller" @scroll="onScroll" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; background: #F2F1EC">

<section class="hero" @click="toEstudio" style="cursor: pointer; position: sticky; top: 0; height: 100%; scroll-snap-align: start; background: #1F211C; color: #F2F1EC; box-sizing: border-box; padding: 0 24px 34px; display: flex; flex-direction: column; justify-content: center; overflow: hidden">
<img src="img/hero-foto.webp" alt="" :class="heroP" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; opacity: 0.42; pointer-events: none">
<div class="heroIn" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 26px; margin-top: 30px; width: 100%">
<img src="img/logo-wordmark.png" alt="Vignale Arquitectura" :class="heroA" style="width: 150px; height: auto; display: block">
<h1 class="tt rv fit" :class="heroOn" :data-max="isDesk ? 150 : 44" style="align-self: stretch; line-height: 1.12; color: #F2F1EC">
<span class="l"><span>Proyectamos <span class="th">tu obra.</span></span></span>
<span class="l r"><span><span class="th">Y la</span> construimos</span></span>
<span class="l r"><span><span class="th">con vos.</span></span></span>
</h1>
</div>
<button type="button" @click="toEstudio" aria-label="Bajar a la siguiente sección" :class="heroC" style="position: absolute; left: 50%; bottom: 34px; margin-left: -26px; width: 52px; height: 52px; border-radius: 50%; border: 1px solid #F2F1EC; background: none; color: #F2F1EC; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<span class="ring" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
<svg class="bob" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</span>
</button>
</section>

<section class="estudio" style="position: relative; z-index: 1; background: #F2F1EC; min-height: 100%; overflow-x: hidden; scroll-snap-align: start; box-sizing: border-box; box-shadow: 0 -18px 40px rgba(0,0,0,.35); padding: 92px 28px 86px; display: flex; flex-direction: column; gap: 18px">
<div class="est-t" style="display: flex; flex-direction: column; gap: 10px">
<p :class="estA" style="margin: 0; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #4F524A">El estudio</p>
<div id="va-estT" class="estT" :class="estShrink ? 'shrink' : ''" :style="estStyle"><h2 class="tt rv" :class="seenOn" style="font-size: 30px; line-height: 1.1; width: max-content"><span class="l"><span>Arquitectura</span></span><span class="l r"><span class="th">pensada para</span></span><span class="l"><span>construirse.</span></span></h2></div>
</div>
<div class="est-p" style="display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.6; text-align: center">
<p :class="estB" style="margin: 0">Somos un estudio de arquitectura de Bahía Blanca especializado en viviendas, ampliaciones y espacios comerciales.</p>
<p :class="estB" style="margin: 0">Ofrecemos un acompañamiento personalizado en cada etapa del proceso, desde el diseño y la planificación hasta la dirección y ejecución de obra.</p>
<p :class="estC" style="margin: 0">Integramos diseño y construcción para desarrollar proyectos funcionales, viables y con una planificación realista de costos y tiempos.</p>
</div>
<div class="est-n" :class="estD" style="display: flex; justify-content: center; gap: 48px; padding: 10px 0; border-top: 1px solid #C9C7BE; border-bottom: 1px solid #C9C7BE">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span class="th" style="font-size: 44px; line-height: 1">36</span><span style="font-size: 13px">obras realizadas</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span class="th" style="font-size: 44px; line-height: 1">5</span><span style="font-size: 13px">años de trayectoria</span></div>
</div>
<div class="est-b" :class="estE" style="margin-top: auto; display: flex; flex-direction: column">
<button type="button" @click="toServicios" style="font: inherit; font-weight: 600; font-size: 15px; border: 1px solid #363932; background: none; color: #363932; padding: 15px 8px; cursor: pointer">Ver servicios</button>
</div>
</section>

</div>
</template>

<template v-if="isServicios">
<div class="page lst" @touchstart="ts" @touchend="te" @mousedown="ts" @mouseup="te" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; background: #E6E4DC; box-sizing: border-box; padding: 76px 24px 90px; display: flex; flex-direction: column; gap: 18px">
<button type="button" @click="goBack" style="font: inherit; font-size: 14px; font-weight: 600; color: inherit; background: none; border: none; padding: 10px 0; min-height: 44px; cursor: pointer; align-self: flex-start; display: flex; align-items: center; gap: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
<span>{{backLabel}}</span>
</button>
